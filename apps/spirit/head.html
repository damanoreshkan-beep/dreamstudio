  <style>
    /* THE CARD AS THE MATERIAL'S OBJECT. The same 78 scans in every theme; a material re-inks the picture with
       ONE filter line, and two overlays read the theme by themselves: a soft-light wash of the theme's own
       mark colour (--app-accent, set per theme module) and the theme's grain tile (--ds-grain, the noise the
       page itself is drawn on; a theme without one — lum, plain — paints nothing). The rim + bloom around the
       card come from sf-e3. "Злегка": saturation never below .4, contrast within ±16 %. */
    .sp-void{container-type:size}
    /* height from BOTH limits at once: the void's height, or the width the 350×600 scan needs at that height —
       so the frame is always exactly the picture's shape and the overlays never cover a letterbox */
    .sp-frame{position:relative;display:block;height:min(100cqh,calc(100cqw * 600 / 350));aspect-ratio:350/600;border-radius:var(--ms-r);overflow:hidden;line-height:0;transition:transform .35s ease,filter .5s ease}
    .sp-art{display:block;width:100%;height:100%;object-fit:cover;transition:filter .5s ease}
    .sp-frame::before{content:"";position:absolute;inset:0;pointer-events:none;background:color-mix(in oklch,var(--app-accent) 14%,transparent);mix-blend-mode:soft-light}
    .sp-frame::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--ds-grain,none);background-size:220px 220px;mix-blend-mode:multiply;opacity:.55}
    html[data-material="paper"] .sp-art{filter:sepia(.32) contrast(.94) saturate(.9)}
    html[data-material="ink"] .sp-art{filter:grayscale(.8) contrast(1.16)}
    html[data-material="mercury"] .sp-art{filter:saturate(.4) contrast(1.06) brightness(1.04)}
    html[data-material="smoke"] .sp-art{filter:saturate(.55) contrast(.96) brightness(.9)}
    html[data-material="thread"] .sp-art{filter:sepia(.2) saturate(1.05) contrast(1.03)}
    html[data-material="circuit"] .sp-art{filter:saturate(.75) contrast(1.1) hue-rotate(12deg)}
    html[data-material="veil"] .sp-art{filter:saturate(1.1) hue-rotate(-10deg) brightness(1.02)}
    html[data-material="ferro"] .sp-art{filter:saturate(.45) contrast(1.15) hue-rotate(20deg)}
    html[data-material="porcelain"] .sp-art{filter:saturate(.8) contrast(.9) brightness(1.06)}
    html[data-material="sand"] .sp-art{filter:sepia(.42) saturate(.95) contrast(.97)}
    html[data-material="plain"] .sp-frame::before{display:none}
    /* the small card inside the spirit's veil: same ink, a fixed short height */
    .sp-mini{position:relative;display:block;height:clamp(5rem,18vh,8rem);aspect-ratio:350/600;border-radius:var(--ms-r-in);overflow:hidden;line-height:0;flex:none}
    /* the words arrive as film subtitles: one beat per character, capped so a long line lands within a second */
    .sp-caret{display:inline-block;width:2px;height:1em;vertical-align:-.12em;background:var(--app-accent);animation:sp-blink 1s steps(2) infinite}
    @keyframes sp-blink{to{opacity:0}}
    @media(prefers-reduced-motion:reduce){.sp-frame,.sp-art{transition:none}.sp-caret{animation:none}}
  </style>
