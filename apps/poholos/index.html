<!DOCTYPE html>
<html lang="uk" data-theme="signal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Поголос</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link href="/_rt/theme.css" rel="stylesheet" type="text/css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21",
      "three": "https://esm.sh/three@0.171.0",
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.mjs",
      "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.mjs",
      "d3-geo": "https://esm.sh/d3-geo@3",
      "topojson-client": "https://esm.sh/topojson-client@3",
      "@microspec/core/runtime/": "/_rt/"
    }
  }
  </script>
  <style>
    /* Поголос — the chat surface. Bubbles, the presence pill and the composer, on the kit's tokens so a
       material re-inks them for free. Nothing here is layout the runtime already owns. */
    /* A chat fills the screen and pins its composer to the bottom. If the runtime slot is height-constrained
       (h-full works) that wins; otherwise fall back to the viewport minus the MEASURED chrome the runtime
       publishes (--hdr-h/--dock-h — never a hand-written pixel), so the composer never floats mid-void. */
    .ph-wrap{display:flex;flex-direction:column;gap:var(--ms-gap);min-height:0;
      height:calc(100svh - var(--hdr-h,56px) - var(--dock-h,64px) - var(--ms-pad,1rem)*2)}
    /* the presence pill: a pulsing node + the count. Accent when someone is near, muted when alone. */
    .ph-near{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--ms-mono,ui-monospace,monospace);
      font-size:var(--ms-label);letter-spacing:.04em}
    .ph-dot{width:.5rem;height:.5rem;border-radius:999px;background:var(--app-accent);box-shadow:0 0 0 0 color-mix(in oklch,var(--app-accent) 60%,transparent);animation:ph-pulse 2.4s ease-out infinite}
    .ph-dot[data-alone="1"]{background:color-mix(in oklch,currentColor 40%,transparent);animation:none;box-shadow:none}
    @keyframes ph-pulse{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--app-accent) 55%,transparent)}70%{box-shadow:0 0 0 .5rem transparent}100%{box-shadow:0 0 0 0 transparent}}
    @media (prefers-reduced-motion:reduce){.ph-dot{animation:none}}
    /* the message list scrolls; the composer stays put */
    .ph-feed{display:flex;flex-direction:column;gap:calc(var(--ms-gap)*.6);overflow-y:auto;min-height:0;flex:1}
    .ph-row{display:flex}
    .ph-row[data-mine="1"]{justify-content:flex-end}
    .ph-bubble{max-width:80%;padding:.5rem .75rem;border-radius:var(--ms-r);background:var(--ms-surface,color-mix(in oklch,currentColor 6%,transparent));line-height:1.35}
    .ph-row[data-mine="1"] .ph-bubble{background:color-mix(in oklch,var(--app-accent) 16%,transparent)}
    .ph-who{font-family:var(--ms-mono,ui-monospace,monospace);font-size:var(--ms-label);opacity:.7;margin-bottom:.1rem}
    .ph-sys{align-self:center;font-size:var(--ms-label);opacity:.55;padding:.15rem 0}
    .ph-meta{font-size:var(--ms-label);opacity:.6;margin-top:.15rem}
    .ph-composer{display:flex;gap:.5rem;align-items:flex-end}
    .ph-input{flex:1;min-width:0}
    .ph-banner{font-size:var(--ms-label);opacity:.75;padding:.35rem .6rem;border-radius:var(--ms-r);background:color-mix(in oklch,var(--app-accent) 10%,transparent)}
  </style>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Поголос</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
</body>
</html>
