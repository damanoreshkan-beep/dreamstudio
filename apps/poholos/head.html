  <style>
    /* Поголос — a modern mesh chat: a scrolling feed between two glass ISLANDS (presence on top, the
       composer at the bottom), bubbles with a tail, depth from the kit's surfaces. Everything on the
       --ms-* tokens and --app-accent so a material re-inks it for free. */
    .ph-wrap{display:flex;flex-direction:column;gap:calc(var(--ms-gap)*.75);min-height:0;
      height:calc(100svh - var(--hdr-h,56px) - var(--dock-h,64px) - var(--ms-pad,1rem)*2)}

    /* presence island: a pulsing node + the count, a small glass chip that floats at the top of the feed */
    .ph-near{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--ms-mono,ui-monospace,monospace);
      font-size:var(--ms-label);letter-spacing:.03em;line-height:1}
    .ph-dot{width:.5rem;height:.5rem;border-radius:999px;background:var(--app-accent);flex:none;
      box-shadow:0 0 .5rem color-mix(in oklch,var(--app-accent) 70%,transparent);animation:ph-pulse 2.4s ease-out infinite}
    /* NEVER bare `currentColor` inside color-mix: the shell's WebView is Chrome 113 on the reference
       emulator and it renders such a declaration INVISIBLE — the hero line and the composer placeholder
       were blank in the APK while every other string drew, and nothing in the browser or the logs showed
       it. Every other rule in this file already reached for the theme token; these had not. */
    .ph-dot[data-alone="1"]{background:color-mix(in oklch,var(--base-content,currentColor) 35%,transparent);animation:none;box-shadow:none}
    @keyframes ph-pulse{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--app-accent) 55%,transparent)}70%{box-shadow:0 0 0 .55rem transparent}100%{box-shadow:0 0 0 0 transparent}}
    @media (prefers-reduced-motion:reduce){.ph-dot{animation:none}}
    .ph-near-sub{color:var(--color-base-muted)}
    /* the rescan control lives inside the presence pill — a comfortable circular tap target (36px), never
       the 24px btn-xs it was, which sat under the tap floor. Ghost by default; the press is a pressed well. */
    .ph-rescan{flex:none;display:grid;place-items:center;width:2.25rem;height:2.25rem;border-radius:999px;
      color:var(--color-base-content);opacity:.7;transition:opacity .15s,transform .1s;-webkit-tap-highlight-color:transparent}
    .ph-rescan:hover{opacity:1}
    .ph-rescan:active{transform:rotate(-40deg) scale(.9);opacity:1}
    .ph-rescan iconify-icon{font-size:1.05rem}

    /* the feed scrolls between the islands; messages grouped, comfortable rhythm */
    .ph-feed{display:flex;flex-direction:column;gap:.28rem;overflow-y:auto;min-height:0;flex:1;
      padding:.2rem .1rem;scrollbar-width:none}
    .ph-feed::-webkit-scrollbar{display:none}
    /* the DM peer list reuses the feed, but raised cards need room to read as separate surfaces — a 4.5px
       chat gap merges their extrusions. This is the roomy list rhythm, with a little top air under the chip. */
    .ph-feed.ph-list{gap:var(--ms-gap);padding-top:.5rem}
    .ph-row{display:flex;max-width:100%}
    .ph-row[data-mine="1"]{justify-content:flex-end}
    .ph-row[data-first="1"]{margin-top:.5rem}

    /* the bubble: a tinted message surface with a tail on the sender's side. It carries no hand-rolled shadow
       (the material's job) — the incoming bubble is a neutral ink tint, the outgoing one wears the app hue as
       a FLAT tint (colour = "mine", not decoration; the old vertical gradient was decorative and is gone). */
    .ph-bubble{position:relative;max-width:80%;padding:.45rem .7rem .38rem;line-height:1.4;
      border-radius:1.15rem 1.15rem 1.15rem .4rem;
      background:color-mix(in oklch,var(--base-content,currentColor) 9%,transparent)}
    .ph-row[data-mine="1"] .ph-bubble{border-radius:1.15rem 1.15rem .4rem 1.15rem;
      background:color-mix(in oklch,var(--app-accent) 22%,transparent)}
    /* the sender's handle: MUTED INK mono, never the accent — accent as text is a bright cyan on paper that
       fails contrast in the light theme, and it is a MARK colour, not a text colour. */
    .ph-who{font-family:var(--ms-mono,ui-monospace,monospace);font-size:var(--ms-label);letter-spacing:.03em;
      color:var(--color-base-muted);margin-bottom:.15rem}
    .ph-text{white-space:pre-wrap;word-break:break-word}
    .ph-meta{display:inline-flex;gap:.3rem;align-items:center;float:right;margin:.25rem 0 -.05rem .6rem;
      font-size:calc(var(--ms-label) * .95);color:var(--color-base-muted);font-variant-numeric:tabular-nums}
    .ph-sys{align-self:center;font-size:var(--ms-label);color:var(--color-base-muted);padding:.3rem 0}

    /* ── the field of who is within earshot ──────────────────────────────────────────────────────
       The WebGL stage draws the sweep and one well per node; these chips are the SAME nodes in the DOM,
       because the DOM is all that axe, e2e and a screen reader can see. A chip's position comes from the
       same peerID hash the shader uses, mapped through the same 62% radius — one derivation, two
       renderers, so they can never drift apart. */
    /* no overflow/isolate/radius here: the stage is `fixed inset-0`, so clipping it to this box is a lie a
       stacking context cannot tell. This layer only holds the chips and the caption. */
    /* The stage is fixed at z-0, above the page's opaque ground; everything else in the wrap is lifted one
       layer so the glass islands and the chips read ON the field instead of under it. A positioned child
       with z-index:1 is the whole mechanism — the canvas needs no clipping and no stacking context. */
    [data-near] > *:not(canvas){position:relative;z-index:1}
    .ph-field{position:relative;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;
      container-type:size}
    /* the split shapes: the field is ~200px tall, so the centre keeps its ring and drops its word, and the
       chips lose their breathing ring — demotion, never deletion: every node is still there and tappable */
    @container (max-height:280px){
      .ph-site-me .ph-site-label{display:none}
      .ph-site-dot::after{display:none}
      .ph-site{gap:.3rem}
    }
    .ph-sites{position:absolute;inset:0}
    /* a node chip: the point the shader draws, then the name on a sliver of glass so it stays legible over
       the sweep. Hairline ring, no fill, no glow blob — the field's language is lines. */
    .ph-site{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
      align-items:center;gap:.45rem;padding:0;text-align:center;transition:transform .12s;
      -webkit-tap-highlight-color:transparent}
    .ph-site:active{transform:translate(-50%,-50%) scale(.94)}
    .ph-site-dot{position:relative;width:.42rem;height:.42rem;border-radius:999px;background:var(--app-accent)}
    .ph-site-dot::after{content:"";position:absolute;inset:-.5rem;border-radius:999px;
      border:1px solid color-mix(in oklch,var(--app-accent) 55%,transparent);
      animation:ph-ring 2.8s ease-in-out infinite}
    @keyframes ph-ring{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:.45}}
    @media (prefers-reduced-motion:reduce){.ph-site-dot::after{animation:none}}
    .ph-site-label{display:flex;flex-direction:column;align-items:center;gap:.05rem;
      padding:.28rem .6rem;border-radius:999px;
      background:color-mix(in oklch,var(--color-base-100,#000) 62%,transparent);
      -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
      border:1px solid color-mix(in oklch,var(--base-content,currentColor) 12%,transparent)}
    .ph-site-name{font-size:var(--ms-label);line-height:1.2;max-width:7rem;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
    .ph-site-id{font-family:var(--ms-mono,ui-monospace,monospace);font-size:calc(var(--ms-label) * .8);
      letter-spacing:.08em;color:var(--color-base-muted)}
    /* me: the centre is not a place either — it is simply where this device stands in its own field */
    .ph-site-me{gap:.25rem}
    .ph-site-me .ph-site-dot{background:transparent;width:.5rem;height:.5rem;
      border:1px solid color-mix(in oklch,var(--base-content,currentColor) 55%,transparent)}
    .ph-site-me .ph-site-dot::after{display:none}
    .ph-site-me .ph-site-label{background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
    .ph-site-me .ph-site-name{color:var(--color-base-muted);
      font-family:var(--ms-mono,ui-monospace,monospace);letter-spacing:.06em}
    .ph-field-note{margin:0 auto .25rem;max-width:22rem;padding:0 1.25rem;text-align:center;
      font-size:var(--ms-label);line-height:1.5;color:var(--color-base-muted)}

    /* the empty-state hero — dead-centre of the area, a soft accent glyph over the line */
    .ph-hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:1rem;text-align:center;padding:1.5rem}
    .ph-hero-glyph{display:grid;place-items:center;width:4.5rem;height:4.5rem;border-radius:999px;font-size:2rem;
      color:var(--app-accent);background:color-mix(in oklch,var(--app-accent) 12%,transparent);
      box-shadow:0 0 1.75rem color-mix(in oklch,var(--app-accent) 16%,transparent)}
    .ph-hero-text{max-width:17rem;line-height:1.5;color:var(--color-base-muted)}

    /* the store/queue banner — a thin accent island line */
    .ph-banner{display:flex;gap:.45rem;align-items:center;font-size:var(--ms-label);opacity:.85;
      padding:.4rem .7rem;border-radius:999px;align-self:center;
      background:color-mix(in oklch,var(--app-accent) 12%,transparent)}
    .ph-banner[data-fault="1"]{background:color-mix(in oklch,var(--color-warning,#d08700) 18%,transparent)}

    /* the composer island's field: seamless inside the glass, no double border */
    .ph-input{flex:1;min-width:0;background:transparent;border:0;outline:0;font:inherit;color:inherit;
      padding:.15rem .1rem;resize:none}
    .ph-input::placeholder{color:var(--color-base-muted)}
    .ph-send{flex:none;display:grid;place-items:center;width:var(--ms-ctl);height:var(--ms-ctl);
      border-radius:999px;background:var(--app-accent);color:#000;transition:opacity .15s,transform .1s}
    .ph-send:disabled{opacity:.3}
    .ph-send:active{transform:scale(.92)}

    /* peer list rows — each is the page EXTRUDED (the kit's raised card material, sf-raised sf-e2), not a flat
       tint box: a tinted rectangle reads as a drop-shadowed panel, which is the look the neumorphic material
       replaced. sf-press gives the pressed well on tap. The row only owns its layout here. */
    .ph-peer{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;
      padding:.7rem .8rem;border-radius:var(--ms-r);transition:box-shadow .15s,background-color .15s}
    .ph-peer-nick{display:block;font-weight:500}
    .ph-peer-id{display:block;margin-top:.05rem;font-size:var(--ms-label);letter-spacing:.06em;
      color:var(--color-base-muted)}
    .ph-peer-chev{color:var(--color-base-muted)}

    /* «Логи» — a diagnostic screen, so it is plain and dense on purpose: the verdict is the only thing
       wearing colour, and colour here is meaning (ok / warn / err), never decoration. */
    .ph-verdict{--vt:var(--color-success,var(--app-accent))}
    .ph-verdict[data-tone="warn"]{--vt:var(--color-warning,#d08700)}
    .ph-verdict[data-tone="err"]{--vt:var(--color-error,#e11d48)}
    .ph-verdict{border:1px solid color-mix(in oklch,var(--vt) 42%,transparent)}
    .ph-verdict > div > iconify-icon{color:var(--vt)}
    .ph-verdict-sub{font-size:var(--ms-label);line-height:1.45;margin-top:.15rem;
      color:var(--color-base-muted);word-break:break-word}

    /* this tab scrolls the page itself, so the last block has to clear the dock — the MEASURED token,
       never a hand-written height (a literal here is right until the dock moves, then silently wrong) */
    [data-logs]{padding-bottom:calc(var(--dock-h) + 1.5rem)}
    /* min-width:0 or a long log line makes the flex item refuse to shrink and the PAGE scrolls sideways */
    .ph-logsec{display:flex;flex-direction:column;gap:.4rem;min-width:0}
    .ph-logh{font-family:var(--ms-mono,ui-monospace,monospace);font-size:var(--ms-label);
      letter-spacing:.08em;text-transform:uppercase;color:var(--color-base-muted)}
    .ph-logempty{font-size:var(--ms-label);color:var(--color-base-muted)}

    /* the state table: a label column that cannot squeeze the value out of view */
    .ph-kv{display:grid;grid-template-columns:minmax(6rem,auto) 1fr;gap:.3rem .7rem;font-size:var(--ms-label)}
    .ph-kv dt{color:var(--color-base-muted)}
    .ph-kv dd{min-width:0;word-break:break-word;font-family:var(--ms-mono,ui-monospace,monospace)}
    .ph-perm{display:inline-block;margin:0 .3rem .25rem 0;padding:.1rem .4rem;border-radius:.4rem;
      background:color-mix(in oklch,var(--base-content,currentColor) 8%,transparent)}
    .ph-perm[data-held="0"]{background:color-mix(in oklch,var(--color-error,#e11d48) 20%,transparent)}
    .ph-capsraw{display:block;margin-top:.2rem;color:var(--color-base-muted);word-break:break-all}

    /* raw log text: wide lines scroll INSIDE the block, never the page */
    .ph-pre{max-height:19rem;overflow:auto;padding:.6rem .7rem;border-radius:var(--ms-r);
      background:color-mix(in oklch,var(--base-content,currentColor) 6%,transparent);
      font-family:var(--ms-mono,ui-monospace,monospace);font-size:calc(var(--ms-label) * .95);
      line-height:1.5;white-space:pre;-webkit-user-select:text;user-select:text}
  </style>
