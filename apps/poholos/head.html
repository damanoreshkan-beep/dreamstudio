  <style>
    /* Поголос — the chat surface. Bubbles, the presence pill and the composer, on the kit's tokens so a
       material re-inks them for free. Nothing here is layout the runtime already owns. */
    /* A chat fills the screen and pins its composer to the bottom. If the runtime slot is height-constrained
       (h-full works) that wins; otherwise fall back to the viewport minus the MEASURED chrome the runtime
       publishes (--hdr-h/--dock-h — never a hand-written pixel), so the composer never floats mid-void. */
    .ph-wrap{display:flex;flex-direction:column;gap:var(--ms-gap);min-height:0;
      height:calc(100svh - var(--hdr-h,56px) - var(--dock-h,64px) - var(--ms-pad,1rem)*2)}
    /* the presence pill: a pulsing node + the count. Accent when someone is near, muted when alone. */
    .ph-near{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--ms-mono,ui-monospace,monospace);
      font-size:var(--ms-label);letter-spacing:.04em}
    .ph-dot{width:.5rem;height:.5rem;border-radius:999px;background:var(--app-accent);box-shadow:0 0 0 0 color-mix(in oklch,var(--app-accent) 60%,transparent);animation:ph-pulse 2.4s ease-out infinite}
    .ph-dot[data-alone="1"]{background:color-mix(in oklch,currentColor 40%,transparent);animation:none;box-shadow:none}
    @keyframes ph-pulse{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--app-accent) 55%,transparent)}70%{box-shadow:0 0 0 .5rem transparent}100%{box-shadow:0 0 0 0 transparent}}
    @media (prefers-reduced-motion:reduce){.ph-dot{animation:none}}
    /* the message list scrolls; the composer stays put */
    .ph-feed{display:flex;flex-direction:column;gap:calc(var(--ms-gap)*.6);overflow-y:auto;min-height:0;flex:1}
    .ph-row{display:flex}
    .ph-row[data-mine="1"]{justify-content:flex-end}
    .ph-bubble{max-width:80%;padding:.5rem .75rem;border-radius:var(--ms-r);background:var(--ms-surface,color-mix(in oklch,currentColor 6%,transparent));line-height:1.35}
    .ph-row[data-mine="1"] .ph-bubble{background:color-mix(in oklch,var(--app-accent) 16%,transparent)}
    .ph-who{font-family:var(--ms-mono,ui-monospace,monospace);font-size:var(--ms-label);opacity:.7;margin-bottom:.1rem}
    .ph-sys{align-self:center;font-size:var(--ms-label);opacity:.55;padding:.15rem 0}
    .ph-meta{font-size:var(--ms-label);opacity:.6;margin-top:.15rem}
    .ph-composer{display:flex;gap:.5rem;align-items:flex-end}
    .ph-input{flex:1;min-width:0}
    .ph-banner{font-size:var(--ms-label);opacity:.75;padding:.35rem .6rem;border-radius:var(--ms-r);background:color-mix(in oklch,var(--app-accent) 10%,transparent)}
  </style>
