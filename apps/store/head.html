  <style>
    /* THE TODAY HERO answers its own width (owner 2026-09-02: "акуратненьку продуману навіть на горизонтальне
       положення, щоб не пуста була"): a container query on the card, never a viewport one — the card is what
       has a width. Narrow: the words and ONE capture. From 34rem of card (a phone in landscape, a tablet): the
       words grow into a display slogan and BOTH captures stand side by side — the app in the theme you are in
       and in the other one, the way the farm's "під світло твоєї теми" is a fact and not a claim. */
    .st-hero{container-type:inline-size}
    .st-hero-shot{width:4.7rem}
    .st-hero-shot2{display:none}
    .st-hero-slogan{font-size:1.15rem;line-height:1.15;text-wrap:balance}
    /* Wide: the words fill the card up to the captures — no max-width and no auto margin, which left an empty
       middle between a short text column and pictures pushed to the far edge (the owner's phone, landscape). */
    @container (min-width:34rem){
      .st-hero-body{padding:1.1rem 1.35rem;gap:1.25rem}
      .st-hero-text{gap:.45rem}
      .st-hero-name{font-size:1.25rem}
      .st-hero-slogan{font-size:1.6rem;line-height:1.08;text-wrap:pretty}
      .st-hero-shots{gap:.6rem}
      .st-hero-shot{width:5.4rem}
      .st-hero-shot2{display:block}
    }
    /* FRESH ARRIVALS — a pager of slides, three cards each. A slide is the rail's width minus 2rem, so the
       next slide peeks in past the .75rem gap by 1.25rem: the hint that there is more, without an arrow. A
       lone slide takes the whole width. No wide variant: the page itself caps at ~34rem, and three wide
       cards in a stack read better there than three narrow ones in a row (eye, landscape 832px). */
    .st-slide{width:calc(100% - 2rem)}
    .st-slide:only-child{width:100%}
    /* The life light: a 2px filament down the card's left edge whose HEIGHT is the app's freshness (--life,
       1 = born today, .12 = the window's last day), lit in the accent. Colour as meaning, no badge. */
    .st-fresh-life{position:absolute;left:0;top:50%;width:2px;height:calc(var(--life,1) * 72%);transform:translateY(-50%);border-radius:1px;background:var(--app-accent);box-shadow:0 0 6px var(--app-accent)}
    /* THE SKY (sky.js): a fixed canvas overlay for the browse view. Insets clear the shell's header and tab
       bar generously — the exact heights are tuned by the eye on a phone, and being a touch too clear beats
       covering a control. The canvas paints its own true-black ground, so it never borrows the host theme. */
    .ms-sky{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 3.5rem);bottom:calc(env(safe-area-inset-bottom,0px) + 4.5rem);z-index:0;touch-action:none;overscroll-behavior:contain}
    .ms-sky-canvas{display:block;width:100%;height:100%;background:var(--color-base-100,#000)}
    /* the accessible mirror of the sky — present for tab order, screen readers, search and the gate, unseen */
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
