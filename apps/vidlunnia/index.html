<!DOCTYPE html>
<html lang="uk" data-theme="signal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Відлуння</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link href="/_rt/theme.css" rel="stylesheet" type="text/css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21",
      "three": "https://esm.sh/three@0.171.0",
      "d3-geo": "https://esm.sh/d3-geo@3",
      "topojson-client": "https://esm.sh/topojson-client@3",
      "@microspec/core/runtime/": "/_rt/"
    }
  }
  </script>
  <style>
    /* the ring: bars move with the level (transform-free — the SVG re-draws), and the mark colour is the app's
       accent only while the voice is live or sealed; a resting ring is ink at low opacity */
    .vd-ring-on{color:var(--app-accent)}
    /* the ring's centre must fit its INNER circle (r 60 of 200 = 60 % of the ring): in a split window the
       stage is 38 % wide and the ring ~230 px, so the word goes and the buttons shrink (eye 2026-09-02:
       the mic sat on the bars, the caption wrapped outside the ring at 412×430 and 360×340) */
    .vd-box{container-type:size}
    @container (max-width:300px){
      .vd-centre .vd-name{display:none}
      .vd-centre{gap:.25rem}
      .vd-centre .btn-lg{--size:calc(var(--size-field,.25rem) * 9)}
      .vd-centre .btn-lg iconify-icon{font-size:1.25rem}
    }
    .vd-ring line{transition:opacity .25s ease}
    /* THE STYLE CARDS — a strip of micro-pictures (256² webp on black, the icon language) with the name under
       each; the chosen one is PRESSED (the rim turns to the accent — the material's own verb), never a bigger
       tile. 56 px pictures: 20 cards scroll in one row at every width; the strip's own overflow is the only
       horizontal scroll and the page never gets one. */
    .vd-cards{scrollbar-width:none;scroll-snap-type:x proximity}
    .vd-cards::-webkit-scrollbar{display:none}
    .vd-card{display:flex;flex-direction:column;align-items:center;gap:.25rem;width:4rem;padding:.25rem .125rem;border-radius:var(--ms-r-in);scroll-snap-align:start;transition:background-color .15s ease}
    .vd-card-pic{width:3.5rem;height:3.5rem;border-radius:calc(var(--ms-r-in) - .125rem);background:#000;object-fit:cover;box-shadow:0 0 0 1px rgba(255,232,196,.14);color:var(--color-base-content);transition:box-shadow .15s ease}
    .vd-card-on .vd-card-pic{box-shadow:0 0 0 2px var(--app-accent),0 0 18px -4px var(--app-accent)}
    .vd-card-name{font-family:var(--font-mono);font-size:.6rem;line-height:1.1;text-transform:uppercase;letter-spacing:.04em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-base-content);opacity:.75}
    .vd-card-on .vd-card-name{opacity:1}
    /* the working state breathes through three staggered dots — a typographic pulse, never a spinner */
    .vd-st{animation:vd-stin .35s ease}
    @keyframes vd-stin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
    .vd-dots span{display:inline-block;animation:vd-dot 1.2s ease-in-out infinite;opacity:.2}
    .vd-dots span:nth-child(2){animation-delay:.2s}
    .vd-dots span:nth-child(3){animation-delay:.4s}
    @keyframes vd-dot{0%,100%{opacity:.2}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.vd-dots span{animation:none;opacity:.7}.vd-st{animation:none}}
  </style>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Відлуння</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
</body>
</html>
