<!DOCTYPE html>
<html lang="uk" data-theme="signal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Іскра</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link href="/_rt/theme.css" rel="stylesheet" type="text/css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21",
      "three": "https://esm.sh/three@0.171.0",
      "three/addons/": "https://esm.sh/three@0.171.0/examples/jsm/",
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.mjs",
      "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.mjs",
      "d3-geo": "https://esm.sh/d3-geo@3",
      "topojson-client": "https://esm.sh/topojson-client@3",
      "@microspec/core/runtime/": "/_rt/"
    }
  }
  </script>
<style>
  .isk-stage {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(1rem, 4vh, 2rem); text-align: center; padding: 1.5rem;
  }

  /* the device: a progress ring around a glowing core */
  .isk-dev { position: relative; width: clamp(148px, 42vw, 200px); aspect-ratio: 1; }
  .isk-ring { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .isk-track { fill: none; stroke: color-mix(in oklab, var(--color-base-content) 12%, transparent); stroke-width: 5; }
  .isk-fill {
    fill: none; stroke: var(--app-accent); stroke-width: 5; stroke-linecap: round;
    transition: stroke-dashoffset .35s cubic-bezier(.4, 0, .2, 1);
    filter: drop-shadow(0 0 6px color-mix(in oklab, var(--app-accent) 70%, transparent));
  }
  .isk-dev.is-done .isk-fill { stroke: var(--app-accent-2); filter: drop-shadow(0 0 8px color-mix(in oklab, var(--app-accent-2) 75%, transparent)); }
  .isk-dev.is-err .isk-fill { stroke: var(--color-error, #f2617a); filter: none; }

  .isk-core {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--color-base-content);
  }
  .isk-glyph { font-size: clamp(2.6rem, 12vw, 3.6rem); line-height: 1;
    filter: drop-shadow(0 0 14px color-mix(in oklab, var(--app-accent) 40%, transparent)); }
  .isk-dev.is-busy .isk-glyph { color: var(--app-accent); animation: isk-breathe 1.6s ease-in-out infinite; }
  .isk-dev.is-done .isk-glyph { color: var(--app-accent-2); filter: drop-shadow(0 0 18px color-mix(in oklab, var(--app-accent-2) 55%, transparent)); }
  .isk-dev.is-err .isk-glyph { color: var(--color-error, #f2617a); filter: none; }
  .isk-pct { font-variant-numeric: tabular-nums; font-weight: 700;
    font-size: clamp(2rem, 9vw, 2.8rem); color: var(--app-accent); letter-spacing: -.02em; }
  .isk-pct span { font-size: .5em; opacity: .6; margin-left: .1em; }

  /* a slow conic sweep behind the core while it works */
  .isk-dev.is-busy::before {
    content: ""; position: absolute; inset: 14%; border-radius: 50%; z-index: -1;
    background: conic-gradient(from 0deg, transparent 0 62%, color-mix(in oklab, var(--app-accent) 22%, transparent) 82%, transparent 100%);
    animation: isk-spin 2.4s linear infinite;
  }

  .isk-status { display: flex; flex-direction: column; gap: .35rem; min-height: 3.2rem; }
  .isk-lede { font-size: 1.02rem; color: var(--color-base-content); max-width: 22ch; }
  .isk-phase { font-size: 1.12rem; font-weight: 600; color: var(--color-base-content); }
  .isk-hint { font-size: .86rem; color: var(--color-base-muted, color-mix(in oklab, var(--color-base-content) 55%, transparent)); max-width: 26ch; }
  .isk-chip { font-size: .78rem; font-variant-numeric: tabular-nums;
    color: color-mix(in oklab, var(--app-accent) 80%, var(--color-base-content)); }
  .isk-bad { color: var(--color-error, #f2617a); }

  .isk-actions { display: flex; flex-direction: column; align-items: center; gap: .6rem; min-height: 3.5rem; }
  .isk-go { min-width: 12rem; gap: .5rem; font-size: 1.05rem; }
  .isk-go iconify-icon { font-size: 1.2em; }
  .isk-dev-name { font-size: .8rem; letter-spacing: .04em;
    color: var(--color-base-muted, color-mix(in oklab, var(--color-base-content) 50%, transparent)); }

  /* the unsupported-browser card */
  .isk-card { display: flex; flex-direction: column; align-items: center; gap: .6rem;
    padding: 1.6rem 1.4rem; border-radius: 1rem; max-width: 22rem; }
  .isk-card iconify-icon { font-size: 2.4rem; }
  .isk-msg { font-weight: 600; font-size: 1.05rem; }

  @keyframes isk-spin { to { transform: rotate(360deg); } }
  @keyframes isk-breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .isk-dev.is-busy::before { animation: none; }
    .isk-dev.is-busy .isk-glyph { animation: none; }
  }
</style>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Іскра</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
</body>
</html>
